<title id="logoTitle">FarolFlow — Versão para fundos escuros</title>
<desc id="logoDesc">Logo FarolFlow: farol com fachos de luz e ondas, à esquerda de Farol e Flow empilhados. Letras vetorizadas; fundo transparente.</desc>
